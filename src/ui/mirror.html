<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela do celular · Devbridge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Crect x='10' y='5' width='12' height='22' rx='2.5' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<script>
  try { var t = JSON.parse(localStorage.getItem('devbridge.theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
  :root {
    --bg: #f4f5fa; --surface: #fff; --surface-2: #f7f8fc; --surface-3: #eceef6;
    --line: #e0e4ef; --text: #202638; --muted: #64708a; --faint: #77839a;
    --accent: #7058e8; --accent-soft: #efebff; --ok: #1d9a68; --warn: #a57424; --danger: #c94e3c;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c101b; --surface: #131927; --surface-2: #192132; --surface-3: #232d42;
      --line: #273247; --text: #edf0f7; --muted: #a0acc0; --faint: #8190aa;
      --accent: #a69bff; --accent-soft: #292541; --ok: #54d6a3; --warn: #edc178; --danger: #ff917e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c101b; --surface: #131927; --surface-2: #192132; --surface-3: #232d42;
    --line: #273247; --text: #edf0f7; --muted: #a0acc0; --faint: #8190aa;
    --accent: #a69bff; --accent-soft: #292541; --ok: #54d6a3; --warn: #edc178; --danger: #ff917e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, a { -webkit-tap-highlight-color: transparent; }
  svg { width: 17px; height: 17px; flex: none; }
  button, a { font: inherit; }
  header { display: flex; align-items: center; gap: 24px; padding: 16px 24px; min-height: 76px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .logo { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--accent); color: var(--bg); flex: none; }
  .logo svg { width: 22px; height: 22px; }
  .brand b { display: block; font-size: 16px; letter-spacing: -.02em; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; }
  nav { display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; font-size: 12.5px; font-weight: 550; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn svg { color: var(--muted); }
  .btn:hover { background: var(--surface-2); border-color: var(--faint); }
  .btn:focus-visible, #screen:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn.on { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .btn.on svg { color: var(--accent); }
  .icon-btn { width: 40px; padding: 0; background: transparent; border-color: transparent; }
  main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
  .mirror-toolbar { display: flex; align-items: center; min-width: 0; gap: 24px; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .capture-status { display: grid; gap: 6px; min-width: 0; flex: 1; }
  .status-line { display: flex; align-items: center; gap: 12px; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; min-width: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; position: relative; }
  .live.on .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 12%, transparent); }
  .live.paused .dot { background: var(--warn); }
  .live.err .dot { background: var(--danger); }
  .meta { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .route { display: block; color: var(--muted); font: 11.5px/1.5 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .route:empty { display: none; }
  .capture-actions { display: flex; align-items: center; min-width: 0; gap: 8px; }
  .viewport { position: relative; display: grid; place-items: center; min-height: 0; min-width: 0; padding: 24px; overflow: hidden; background-image: radial-gradient(var(--line) .7px, transparent .7px); background-size: 18px 18px; }
  .phone { position: relative; width: 100%; height: 100%; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; width: auto; height: auto; max-height: 100%; max-width: 100%; min-width: 0; min-height: 0; object-fit: contain; border: 0; border-radius: 16px; background: #080c15; box-shadow: 0 0 0 8px #080c15, 0 24px 60px rgba(0, 0, 0, .24), 0 0 0 9px var(--line); }
  #screen:not([src]) { visibility: hidden; }
  .phone.control #screen { cursor: crosshair; touch-action: none; user-select: none; }
  .phone.stale #screen { filter: grayscale(.6) brightness(.6); transition: filter .4s; }
  .overlay { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
  .overlay.show { display: grid; }
  .overlay > div { max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: 0 16px 48px rgba(0, 0, 0, .15); }
  .overlay strong { display: block; font-size: 17px; margin-bottom: 8px; letter-spacing: -.02em; }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 20px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--line); padding: 10px 18px; border-radius: 12px; font-size: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 700px) {
    header { padding: 12px 16px; gap: 12px; min-height: 68px; }
    .mirror-toolbar { padding: 14px 16px; gap: 14px; flex-wrap: wrap; }
    .capture-status { flex-basis: 100%; }
    .capture-actions { width: 100%; }
    .capture-actions .btn { flex: 1 1 0; min-width: 0; min-height: 56px; flex-direction: column; gap: 4px; padding: 6px; font-size: 11.5px; }
    .viewport { padding: 18px; }
    nav .btn span { display: none; }
    nav .btn { width: 40px; padding: 0; }
    .brand small { font-size: 10.5px; }
  }
  @media (max-height: 520px) and (min-width: 701px) {
    header { min-height: 60px; padding: 10px 20px; }
    .mirror-toolbar { padding: 10px 20px; }
    .viewport { padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg></span>
    <div><b>Devbridge</b><small>Tela do celular</small></div>
  </div>
  <nav aria-label="Outras telas">
    <a class="btn" href="/__devbridge/" target="devbridge-console" title="Abrir console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span>Console</span></a>
    <a class="btn" href="/__devbridge/tests" target="devbridge-tests" title="Abrir testes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/></svg><span>Testes</span></a>
  </nav>
  <button class="btn icon-btn" id="theme" title="Tema" aria-label="Alterar tema"></button>
</header>
<main>
  <div class="mirror-toolbar">
    <div class="capture-status">
      <div class="status-line"><span class="live" id="live" role="status"><span class="dot"></span><span id="liveText">Conectando…</span></span><span class="meta" id="fps"></span></div>
      <span class="route" id="route" title="Tela atual do app"></span>
    </div>
    <div class="capture-actions" role="group" aria-label="Ações do espelhamento">
      <button class="btn" id="control" title="Controlar o celular: clique toca, arraste desliza, teclado digita (Esc = voltar)" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4.6 15.9a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg><span id="controlLabel">Controlar</span>
      </button>
      <button class="btn" id="pause" title="Pausar (espaço)" aria-pressed="false"></button>
      <button class="btn" id="save" title="Salvar quadro como PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span>Salvar PNG</span></button>
    </div>
  </div>
  <div class="viewport">
    <div class="phone" id="phone"><img id="screen" alt="Tela do celular ao vivo" tabindex="0"></div>
    <div class="overlay show" id="overlay" role="status"><div><div class="spinner" id="spin"></div><strong id="ovTitle">Conectando ao celular…</strong><p id="ovText">A primeira captura leva cerca de 1 s.</p></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
  var themes = ['auto', 'light', 'dark'];
  var theme = 'auto';
  try { var savedTheme = JSON.parse(localStorage.getItem('devbridge.theme')); if (themes.indexOf(savedTheme) >= 0) theme = savedTheme; } catch (e) {}
  function applyTheme(value) {
    if (value === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', value);
    var symbol = value === 'light' ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>' : value === 'dark' ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>' : '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>';
    $('theme').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + symbol + '</svg>';
    $('theme').title = 'Tema: ' + ({ auto: 'automático', light: 'claro', dark: 'escuro' })[value] + ' (clique para trocar)';
    $('theme').setAttribute('aria-label', $('theme').title);
  }
  $('theme').onclick = function () {
    theme = themes[(themes.indexOf(theme) + 1) % themes.length];
    try { localStorage.setItem('devbridge.theme', JSON.stringify(theme)); } catch (e) {}
    applyTheme(theme);
  };
  applyTheme(theme);
  var seq = 0;
  var paused = false;
  var running = false;
  var lastBlob = null;
  var times = [];

  function setLive(kind, text) {
    $('live').className = 'live ' + kind;
    $('liveText').textContent = text;
  }

  function overlay(show, title, text, spin) {
    $('overlay').classList.toggle('show', show);
    $('phone').classList.toggle('stale', show && !!lastBlob);
    if (!show) return;
    $('ovTitle').textContent = title;
    $('ovText').textContent = text || '';
    $('spin').style.display = spin ? '' : 'none';
  }

  function toast(text) {
    $('toast').textContent = text;
    $('toast').classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { $('toast').classList.remove('show'); }, 1600);
  }

  function showFrame(blob, frameSeq) {
    var url = URL.createObjectURL(blob);
    var img = $('screen');
    var old = img.src;
    img.onload = function () { if (old) URL.revokeObjectURL(old); };
    img.src = url;
    lastBlob = blob;
    seq = frameSeq;
    var now = performance.now();
    times.push(now);
    while (times.length && now - times[0] > 3000) times.shift();
    var fps = times.length > 1 ? (times.length - 1) / ((now - times[0]) / 1000) : 0;
    $('fps').textContent = fps ? fps.toFixed(1) + ' qps' : '';
    setLive('on', 'Ao vivo');
    overlay(false);
  }

  // Long-poll: cada pedido volta com um quadro novo; enquanto houver pedidos, o servidor captura.
  function loop() {
    if (running) return;
    running = true;
    (function tick() {
      if (paused || document.hidden) { running = false; return; }
      fetch('/__devbridge/api/mirror/frame?after=' + seq, { headers: { 'X-Devbridge': '1' }, cache: 'no-store' })
        .then(function (res) {
          if (res.status === 204) return null;
          if (res.ok) {
            var s = Number(res.headers.get('X-Frame-Seq'));
            // Pedido que já estava a caminho quando pausou: descarta o quadro.
            return res.blob().then(function (b) { if (!paused) showFrame(b, s); });
          }
          return res.json().then(function (d) { throw new Error(d.error || ('HTTP ' + res.status)); });
        })
        .then(function () { setTimeout(tick, 0); })
        .catch(function (e) {
          var offline = /Failed to fetch|NetworkError/i.test(e.message);
          setLive('err', offline ? 'Servidor fora do ar' : 'Sem imagem');
          $('fps').textContent = '';
          overlay(true, offline ? 'Servidor fora do ar' : 'Não consegui capturar a tela',
            offline ? 'Rode "dvb start" na raiz do app.' : e.message + ' — confira o cabo e se o celular está desbloqueado.', false);
          setTimeout(tick, 1500);
        });
    })();
  }

  function setPaused(p) {
    paused = p;
    $('pause').innerHTML = (p ? ICON_PLAY : ICON_PAUSE) + '<span>' + (p ? 'Retomar' : 'Pausar') + '</span>';
    $('pause').setAttribute('aria-pressed', String(p));
    $('pause').title = p ? 'Retomar (espaço)' : 'Pausar (espaço)';
    if (p) {
      setLive('paused', 'Pausado');
      $('fps').textContent = '';
      times = [];
    } else {
      setLive('', seq ? 'retomando…' : 'conectando…');
      loop();
    }
  }

  // Rota atual do app, a cada 2 s (a mesma do console).
  function pollRoute() {
    fetch('/__devbridge/api/status', { headers: { 'X-Devbridge': '1' } }).then(function (r) { return r.json(); }).then(function (s) {
      var href = s.app && !s.app.error ? (s.app.href || '').replace(/^https?:\/\/[^/]+/, '') : '';
      $('route').textContent = href;
      document.title = (href ? href.replace(/^.*#!?\/?/, '') + ' · ' : '') + 'Tela do celular';
    }).catch(function () { $('route').textContent = ''; });
  }

  // ---- controle ----
  // Clique vira toque, arrasto vira deslize e o teclado digita no celular. As
  // ações vão em fila para texto e teclas chegarem na ordem em que foram feitos.
  var control = false;
  var drag = null;
  var typed = '';
  var typeTimer = null;
  var queue = Promise.resolve();
  var KEYMAP = { Enter: 'enter', Backspace: 'del', Escape: 'back', Tab: 'tab', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };

  function sendInput(body) {
    queue = queue.then(function () {
      return fetch('/__devbridge/api/input', {
        method: 'POST',
        headers: { 'X-Devbridge': '1', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status)); });
      }).catch(function (e) { toast(e.message); });
    });
  }

  // Pixels do aparelho, descontando as faixas do object-fit: contain.
  function devicePoint(ev) {
    var img = $('screen');
    if (!img.naturalWidth) return null;
    var r = img.getBoundingClientRect();
    var scale = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
    var x = (ev.clientX - r.left - (r.width - img.naturalWidth * scale) / 2) / scale;
    var y = (ev.clientY - r.top - (r.height - img.naturalHeight * scale) / 2) / scale;
    if (x < 0 || y < 0 || x > img.naturalWidth || y > img.naturalHeight) return null;
    return { x: Math.round(x), y: Math.round(y), cx: ev.clientX, cy: ev.clientY };
  }

  function flushTyped() {
    clearTimeout(typeTimer);
    typeTimer = null;
    if (!typed) return;
    sendInput({ action: 'text', text: typed });
    typed = '';
  }

  function setControl(on) {
    control = on;
    $('control').classList.toggle('on', on);
    $('control').setAttribute('aria-pressed', String(on));
    $('controlLabel').textContent = on ? 'Controlando' : 'Controlar';
    if (on) $('screen').focus({ preventScroll: true });
    $('phone').classList.toggle('control', on);
    toast(on ? 'Controle ligado: clique toca, arraste desliza, teclado digita' : 'Controle desligado');
  }

  $('control').onclick = function () { setControl(!control); };
  $('screen').addEventListener('dragstart', function (ev) { ev.preventDefault(); });
  $('screen').addEventListener('pointerdown', function (ev) {
    if (!control) return;
    ev.preventDefault();
    $('screen').focus({ preventScroll: true });
    drag = { p: devicePoint(ev), t: Date.now() };
  });
  $('screen').addEventListener('pointerup', function (ev) {
    if (!control || !drag) return;
    var a = drag.p;
    var b = devicePoint(ev);
    var ms = Date.now() - drag.t;
    drag = null;
    if (!a || !b) return;
    flushTyped();
    if (Math.abs(b.cx - a.cx) + Math.abs(b.cy - a.cy) < 8) {
      sendInput({ action: 'tap', x: a.x, y: a.y });
      toast('Toque em ' + a.x + ', ' + a.y);
    } else {
      sendInput({ action: 'swipe', x1: a.x, y1: a.y, x2: b.x, y2: b.y, durationMs: Math.min(Math.max(ms, 100), 2000) });
      toast('Deslize');
    }
  });

  $('pause').onclick = function () { setPaused(!paused); };
  $('save').onclick = function () {
    if (!lastBlob) return toast('Ainda não há quadro');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob);
    a.download = 'tela-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.png';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('Quadro salvo');
  };
  document.addEventListener('keydown', function (ev) {
    if (ev.target.closest && ev.target.closest('button, a, input, select, textarea')) return;
    // Com controle ligado o teclado é do celular (inclusive o espaço); letras se juntam em um texto só.
    if (control && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      if (KEYMAP[ev.key]) {
        ev.preventDefault();
        flushTyped();
        return sendInput({ action: 'key', key: KEYMAP[ev.key] });
      }
      if (ev.key.length === 1) {
        ev.preventDefault();
        typed += ev.key;
        clearTimeout(typeTimer);
        typeTimer = setTimeout(flushTyped, 250);
        return;
      }
    }
    if (ev.key === ' ') { ev.preventDefault(); setPaused(!paused); }
  });
  // Janela minimizada ou em outra aba: para de capturar e poupa a CPU do celular.
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !paused) loop(); });

  setPaused(false);
  pollRoute();
  setInterval(pollRoute, 2000);
})();
</script>
</body>
</html>
